name: Validate infrastructure and Lambda packages
on:
    schedule:
        - cron: "27 */2 * * *"
        - cron: "57 */2 * * *"
    pull_request:
    workflow_dispatch:
permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validation-needed:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            actions: read
        outputs:
            run: ${{ steps.check.outputs.run }}
        steps:
            - name: Check whether this main revision already passed validation
              id: check
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                  script: |
                      if (context.eventName !== 'schedule') {
                        core.setOutput('run', 'true');
                        return;
                      }
                      const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                        ...context.repo,
                        workflow_id: 'validate.yml',
                        branch: 'main',
                        head_sha: context.sha,
                        per_page: 100,
                      });
                      for (const run of runs) {
                        if (run.id === context.runId || run.head_sha !== context.sha || run.event === 'pull_request') continue;
                        const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                          ...context.repo,
                          run_id: run.id,
                          filter: 'latest',
                          per_page: 100,
                        });
                        if (jobs.some(job => job.name === 'validate' && job.status === 'completed' && job.conclusion === 'success')) {
                          core.info(`Revision ${context.sha} passed validation in run ${run.id}.`);
                          core.setOutput('run', 'false');
                          return;
                        }
                      }
                      core.setOutput('run', 'true');

    validate:
        needs: validation-needed
        if: needs.validation-needed.outputs.run == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
            - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: "3.12"
            - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
              with:
                  terraform_version: 1.15.8
            - name: Cache Terraform providers
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .terraform/providers
                  key: terraform-plugins-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.terraform.lock.hcl') }}
                  restore-keys: |
                      terraform-plugins-v1-${{ runner.os }}-${{ runner.arch }}-
            - run: npm ci --ignore-scripts
            - run: npm --prefix authorizer ci
            - run: python3 -m venv .venv-quality
            - run: .venv-quality/bin/pip install -r requirements-quality.txt
            - run: terraform init -backend=false -lockfile=readonly
            # Quality gates run on the clean checkout, before the scanner writes its
            # downloaded policy cache, so formatting checks only see project files.
            - run: npm run check
            - name: Security configuration scan (HIGH/CRITICAL)
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  version: v0.69.3
                  scan-type: config
                  scan-ref: .
                  severity: HIGH,CRITICAL
                  exit-code: "1"
                  hide-progress: true
                  skip-dirs: node_modules,.terraform,.venv-quality,graphify-out
                  trivyignores: .trivyignore.yaml
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: lambda-packages
                  overwrite: true
                  retention-days: 14
                  path: |
                      authorizer.zip
                      migration-runner-placeholder.zip
                      rotation-function.zip
                  if-no-files-found: error
