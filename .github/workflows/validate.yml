name: Validate infrastructure and Lambda packages
on:
    push:
        branches: [main]
    pull_request:
permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
            - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: "3.12"
            - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
              with:
                  terraform_version: 1.15.8
            - run: npm ci --ignore-scripts
            - run: npm --prefix authorizer ci
            - run: python3 -m venv .venv-quality
            - run: .venv-quality/bin/pip install -r requirements-quality.txt
            - run: terraform init -backend=false -lockfile=readonly
            - name: Security configuration scan (HIGH/CRITICAL)
              uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
              with:
                  version: v0.69.3
                  scan-type: config
                  scan-ref: .
                  severity: HIGH,CRITICAL
                  exit-code: "1"
                  hide-progress: true
                  skip-dirs: node_modules,.terraform,.venv-quality,graphify-out
                  trivyignores: .trivyignore.yaml
            - run: npm run check
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: lambda-packages
                  path: |
                      authorizer.zip
                      migration-runner-placeholder.zip
                      rotation-function.zip
                  if-no-files-found: error
