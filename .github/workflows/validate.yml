name: Validate infrastructure and Lambda packages
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - run: npm ci --ignore-scripts
      - run: npm --prefix authorizer ci
      - run: python3 -m venv .venv-quality
      - run: .venv-quality/bin/pip install -r requirements-quality.txt
      - run: terraform init -backend=false -lockfile=readonly
      - run: npm run check
