version: 2

updates:
    # Root Node quality tooling (package.json + package-lock.json).
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 2
      groups:
          non-major:
              applies-to: version-updates
              patterns:
                  - "*"
              update-types:
                  - "minor"
                  - "patch"

    # API authorizer Lambda (package.json + package-lock.json).
    - package-ecosystem: "npm"
      directory: "/authorizer"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 2
      groups:
          non-major:
              applies-to: version-updates
              patterns:
                  - "*"
              update-types:
                  - "minor"
                  - "patch"

    # Root Python quality tooling (requirements-quality.txt).
    - package-ecosystem: "pip"
      directory: "/"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 2
      groups:
          non-major:
              applies-to: version-updates
              patterns:
                  - "*"
              update-types:
                  - "minor"
                  - "patch"

    # Rotation Lambda (requirements.txt, hash-pinned).
    - package-ecosystem: "pip"
      directory: "/rotation-function"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 2
      groups:
          non-major:
              applies-to: version-updates
              patterns:
                  - "*"
              update-types:
                  - "minor"
                  - "patch"

    # Root Terraform providers/modules (.tf + .terraform.lock.hcl).
    - package-ecosystem: "terraform"
      directory: "/"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 2
      groups:
          non-major:
              applies-to: version-updates
              patterns:
                  - "*"
              update-types:
                  - "minor"
                  - "patch"

    # Pinned actions in .github/workflows.
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 2
      groups:
          non-major:
              applies-to: version-updates
              patterns:
                  - "*"
              update-types:
                  - "minor"
                  - "patch"
